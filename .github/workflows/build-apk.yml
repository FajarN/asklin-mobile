name: Build ASKLIN Mobile APK (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          flutter create . --org org.asklin --project-name asklin_mobile --platforms android
          rm -rf test

      - name: Configure Target SDK 34 (Android 14) & Permissions
        run: |
          # Naikkan compileSdkVersion dan targetSdkVersion ke 34 (Android 14)
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/flutter.compileSdkVersion/34/' android/app/build.gradle || true
          sed -i 's/flutter.targetSdkVersion/34/' android/app/build.gradle || true

          # Tambahkan izin internet dan storage ke AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Dart Code
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asklin-mobile-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
