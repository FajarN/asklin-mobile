name: Build ASKLIN Mobile APK (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          flutter create . --org org.asklin --project-name asklin_mobile --platforms android
          rm -rf test

          # Restore our analysis_options & pubspec (flutter create overwrites them)
          git checkout analysis_options.yaml 2>/dev/null || true
          git checkout pubspec.yaml 2>/dev/null || true
          git checkout assets/ 2>/dev/null || true

      - name: Configure Android App Identity & SDK
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"

          # ===== 1. FIX APP NAME: "ASKLIN" =====
          sed -i 's/android:label="asklin_mobile"/android:label="ASKLIN"/' "$MANIFEST"

          # ===== 2. FIX targetSdkVersion & compileSdkVersion to 34 (Android 14) =====
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$GRADLE"
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' "$GRADLE"
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' "$GRADLE"
          sed -i 's/flutter\.compileSdkVersion/34/g' "$GRADLE"
          sed -i 's/flutter\.targetSdkVersion/34/g' "$GRADLE"
          sed -i 's/flutter\.minSdkVersion/21/g' "$GRADLE"

          # ===== 3. ADD INTERNET PERMISSION =====
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' "$MANIFEST"

          # ===== 4. ENSURE LAUNCHER INTENT FILTER EXISTS =====
          # Flutter create usually includes this, but verify it's correct
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"
          echo "--- build.gradle ---"
          grep -E 'compileSdk|targetSdk|minSdk' "$GRADLE" || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Verify Dart Code
        run: flutter analyze lib/ || true

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK Output
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ASKLIN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASKLIN-release
          path: build/app/outputs/flutter-apk/ASKLIN.apk
          if-no-files-found: error
