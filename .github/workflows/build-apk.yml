name: Build ASKLIN Mobile APK (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          flutter create . --org org.asklin --project-name asklin_mobile --platforms android
          rm -rf test

          # Restore our analysis_options & pubspec (flutter create overwrites them)
          git checkout analysis_options.yaml 2>/dev/null || true
          git checkout pubspec.yaml 2>/dev/null || true
          git checkout assets/ 2>/dev/null || true

      - name: Configure Android App Identity & SDK
        run: |
          python3 -c "
          import os, re

          # 1. Update AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m_content = f.read()

              # Replace application label with ASKLIN
              m_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"ASKLIN\"', m_content)

              # Ensure permissions exist
              perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n'''
              if 'android.permission.INTERNET' not in m_content:
                  m_content = m_content.replace('<application', perms + '    <application')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m_content)
              print('Updated AndroidManifest.xml with Notification permissions')

          # 2. Update strings.xml if exists
          strings_path = 'android/app/src/main/res/values/strings.xml'
          if os.path.exists(strings_path):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  s_content = f.read()
              s_content = re.sub(r'<string name=\"app_name\">.*?</string>', '<string name=\"app_name\">ASKLIN</string>', s_content)
              with open(strings_path, 'w', encoding='utf-8') as f:
                  f.write(s_content)
              print('Updated strings.xml')

          # 3. Setup Firebase google-services.json if missing
          gservices_path = 'android/app/google-services.json'
          if not os.path.exists(gservices_path):
              sample_json = '''{
  "project_info": {
    "project_number": "123456789012",
    "project_id": "asklin-mobile",
    "storage_bucket": "asklin-mobile.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
        "android_client_info": {
          "package_name": "org.asklin.asklin_mobile"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDummyKeyForAsklinMobileBuild123456"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}'''
              with open(gservices_path, 'w', encoding='utf-8') as f:
                  f.write(sample_json)
              print('Generated default android/app/google-services.json')

          # 4. Update top-level build.gradle with google-services classpath
          top_gradle_path = 'android/build.gradle'
          if os.path.exists(top_gradle_path):
              with open(top_gradle_path, 'r', encoding='utf-8') as f:
                  tg = f.read()
              if 'com.google.gms:google-services' not in tg:
                  if 'dependencies {' in tg:
                      tg = tg.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.1'")
                  with open(top_gradle_path, 'w', encoding='utf-8') as f:
                      f.write(tg)
                  print('Added google-services classpath to android/build.gradle')

          # 5. Update app-level build.gradle for SDK 34 (Android 14) and apply google-services plugin
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g_content = f.read()

              # Standardize to Groovy method call syntax: compileSdkVersion 34, targetSdkVersion 34, minSdkVersion 21
              g_content = re.sub(r'compileSdk(?:Version)?\s*=?\s*.*', 'compileSdkVersion 34', g_content)
              g_content = re.sub(r'targetSdk(?:Version)?\s*=?\s*.*', 'targetSdkVersion 34', g_content)
              g_content = re.sub(r'minSdk(?:Version)?\s*=?\s*.*', 'minSdkVersion 21', g_content)

              if 'apply plugin: \'com.google.gms.google-services\'' not in g_content and 'com.google.gms.google-services' not in g_content:
                  g_content += "\napply plugin: 'com.google.gms.google-services'\n"

              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g_content)
              print('Updated app build.gradle with SDK 34 and google-services plugin')
          "

          echo "=== CONFIGURED AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== CONFIGURED android/app/build.gradle ==="
          cat android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Verify Dart Code
        run: |
          echo "=== RUNNING FLUTTER ANALYZE ==="
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/ || true

      - name: Build APK Release
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log

      - name: Rename APK Output
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ASKLIN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASKLIN-release
          path: build/app/outputs/flutter-apk/ASKLIN.apk
          if-no-files-found: error

      - name: Publish ASKLIN Release APK (One-Click Mobile Download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :latest 2>/dev/null || true
          gh release create latest build/app/outputs/flutter-apk/ASKLIN.apk \
            --title "ASKLIN Mobile App (Release)" \
            --notes "Aplikasi Mobile Resmi ASKLIN - Asosiasi Klinik Indonesia.%0AUnduh langsung file ASKLIN.apk dan instal di perangkat Android Anda."

      - name: Publish Debug Log on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-log --yes 2>/dev/null || true
          git tag -d debug-log 2>/dev/null || true
          git push origin :debug-log 2>/dev/null || true
          gh release create debug-log build.log \
            --title "Build Failure Debug Log" \
            --notes "Log file for debugging build failure" 2>/dev/null || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
