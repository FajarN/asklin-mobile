name: Build ASKLIN Mobile APK (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform Files
        run: |
          flutter create . --org org.asklin --project-name asklin_mobile --platforms android
          rm -rf test

          # Restore our analysis_options & pubspec (flutter create overwrites them)
          git checkout analysis_options.yaml 2>/dev/null || true
          git checkout pubspec.yaml 2>/dev/null || true
          git checkout assets/ 2>/dev/null || true

      - name: Configure Android App Identity & SDK
        run: |
          python3 -c "
          import os, re

          # 1. Update AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m_content = f.read()

              # Replace application label with ASKLIN
              m_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"ASKLIN\"', m_content)

              # Ensure permissions exist
              perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'''
              if 'android.permission.INTERNET' not in m_content:
                  m_content = m_content.replace('<application', perms + '    <application')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m_content)
              print('Updated AndroidManifest.xml')

          # 2. Update strings.xml if exists
          strings_path = 'android/app/src/main/res/values/strings.xml'
          if os.path.exists(strings_path):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  s_content = f.read()
              s_content = re.sub(r'<string name=\"app_name\">.*?</string>', '<string name=\"app_name\">ASKLIN</string>', s_content)
              with open(strings_path, 'w', encoding='utf-8') as f:
                  f.write(s_content)
              print('Updated strings.xml')

          # 3. Update build.gradle for SDK 34 (Android 14)
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g_content = f.read()

              g_content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', g_content)
              g_content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', g_content)
              g_content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 34', g_content)
              g_content = re.sub(r'targetSdk\s*=.*', 'targetSdk = 34', g_content)
              g_content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', g_content)
              g_content = re.sub(r'minSdk\s*=.*', 'minSdk = 21', g_content)
              g_content = g_content.replace('flutter.compileSdkVersion', '34')
              g_content = g_content.replace('flutter.targetSdkVersion', '34')
              g_content = g_content.replace('flutter.minSdkVersion', '21')

              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g_content)
              print('Updated build.gradle with SDK 34')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Verify Dart Code
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build APK Release
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || {
            BUILD_CODE=$?
            echo "==================== DUMPING BUILD ERRORS TO ANNOTATIONS ===================="
            python3 -c "
            with open('build.log', 'r', errors='ignore') as f:
                lines = [l.strip() for l in f]

            # 1. Look for Dart/Gradle failure messages
            relevant = []
            for idx, line in enumerate(lines):
                if any(w in line for w in ['Error:', 'FAILURE:', 'Exception:', 'Target ', 'failed with exit code']):
                    for c in lines[max(0, idx-2):min(len(lines), idx+4)]:
                        if c and c not in relevant:
                            relevant.append(c)

            print(f'Found {len(relevant)} relevant error lines.')
            for i, r in enumerate(relevant[:15]):
                # GitHub annotation format
                clean_r = r.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                print(f'::error title=Err_{i}::{clean_r[:250]}')
            "
            tail -n 100 build.log
            exit $BUILD_CODE
          }

      - name: Rename APK Output
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ASKLIN.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASKLIN-release
          path: build/app/outputs/flutter-apk/ASKLIN.apk
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Publish Build Failure Log to Release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-log --yes 2>/dev/null || true
          git tag -d debug-log 2>/dev/null || true
          git push origin :debug-log 2>/dev/null || true
          gh release create debug-log build.log --title "Build Failure Log" --notes "Automated CI failure log"
